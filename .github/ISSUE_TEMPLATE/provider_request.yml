name: Price provider request
description: A public, keyless price API whencheap should support
labels: [provider]
body:
  - type: input
    id: region
    attributes:
      label: Country / market / zones
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: API endpoint URL (must work without an API key)
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sample response (a few entries) and units
      render: json
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: Data licence / attribution requirement
