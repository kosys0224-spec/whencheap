[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whencheap"
version = "0.1.0"
description = "Find the cheapest hours to run things - EV charging, backups, batch jobs - from public day-ahead electricity prices or your own time-of-use tariff. Zero dependencies, no API key."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Inhyeok Park" }]
keywords = ["electricity", "energy", "prices", "day-ahead", "spot-price", "time-of-use", "scheduler", "cli", "ev-charging", "smart-home"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Home Automation",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kosys0224-spec/whencheap"
Issues = "https://github.com/kosys0224-spec/whencheap/issues"
Changelog = "https://github.com/kosys0224-spec/whencheap/blob/main/CHANGELOG.md"

[project.scripts]
whencheap = "whencheap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whencheap = ["py.typed"]
